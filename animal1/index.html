#fff0d6}.btn.primary{background:#4c9b7c}.btn:disabled{opacity:.5;cursor:default}.note{font-size:13px;color:#738478}.answer{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}.answer button{min-width:180px}footer{text-align:center;color:#718679;font-size:13px;padding:18px}@media(max-width:650px){.animals{grid-template-columns:repeat(2,minmax(0,1fr))}.animal{min-height:185px}.animal img{height:125px}.animal span{font-size:19px}.bubble{font-size:17px}}

<section class="panel" id="learn"><div class="hero"><div class="robot">🤖</div><div class="bubble">我们一起看视频，认识农场里的小动物吧！</div></div><p class="video-help">点击视频播放动物的动作和叫声；点击下方的中文句子，可以听老师朗读。</p><div class="video-grid" id="videoAnimals"></div></section>
<section class="panel hidden" id="listen"><div class="hero"><div class="robot">🤖</div><div class="bubble" id="listenSpeech" data-tts-text="小朋友，听一听！是谁在叫呀？">小朋友，听一听！是谁在叫呀？</div><button class="question-audio" id="listenQuestionAudio" type="button" aria-label="朗读题目">🔊 听题目</button></div><p class="center note">有真实录音时，放进 assets/audio 文件夹即可；没有录音时，机器人会读出中文拟声词。</p><div class="controls"><button class="btn primary" id="play">🔊 播放叫声</button><button class="btn" id="repeat">🔁 再听一次</button></div><div class="animals" id="listenAnimals"></div><div class="feedback" id="listenFeedback" aria-live="polite"></div><div class="center"><span class="score" id="listenScore">答对 0 题</span>　<button class="btn" id="listenNext">下一题 ➜</button></div></section>
<section class="panel hidden" id="find"><div class="hero"><div class="robot">🤖</div><div class="bubble">小朋友，帮我找到正确的小动物吧！</div></div><div class="prompt-row"><div class="prompt" id="findPrompt"></div><button class="question-audio" id="findQuestionAudio" type="button">🔊 听题目</button></div><div class="animals" id="findAnimals"></div><div class="feedback" id="findFeedback" aria-live="polite"></div><div class="center"><span class="score" id="findScore">答对 0 题</span>　<button class="btn" id="findNext">下一题 ➜</button></div></section>
<section class="panel hidden" id="like"><div class="hero"><div class="robot">🤖</div><div class="bubble">我们一起练习说完整的中文句子！</div></div><div class="center"><img id="likeImg" alt="动物图片" style="height:290px;max-width:80%;object-fit:contain"><div class="prompt-row"><div class="prompt" id="likePrompt"></div><button class="question-audio" id="likeQuestionAudio" type="button">🔊 听题目</button></div><div class="answer"><button class="btn primary" id="yes"><span class="heart-symbol" aria-hidden="true">❤️</span><span>我喜欢……</span></button><button class="btn" id="no"><span class="heart-symbol" aria-hidden="true">💔</span><span>我不喜欢……</span></button></div><div class="feedback" id="likeFeedback" aria-live="polite"></div><button class="btn" id="likeNext">下一只动物 ➜</button></div></section>

<script>
const animals=[{id:'dog',name:'小狗',call:'汪汪汪'},{id:'cat',name:'小猫',call:'喵喵喵'},{id:'chick',name:'小鸡',call:'叽叽叽'},{id:'duck',name:'小鸭',call:'嘎嘎嘎'},{id:'mouse',name:'小老鼠',call:'吱吱吱'}];
const audioBase='assets/audio/';const imageBase='assets/images/';let listenTarget,findTarget,likeIndex=0,listenPoints=0,findPoints=0,listenDone=false,findDone=false;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function speakChinese(text){farmSpeak(text)} function speak(s){speakChinese(s)}
function renderCards(container,fn){container.innerHTML='';shuffle(animals).forEach(a=>{let b=document.createElement('button');b.className='animal';b.innerHTML=`<img src="${imageBase}${a.id}.png" alt="${a.name}"><span>${a.name}</span>`;b.onclick=()=>fn(a,b);container.appendChild(b)})}function resetCardClasses(id){$(id).querySelectorAll('.animal').forEach(b=>b.classList.remove('correct','wrong'))}
function chooseListen(){listenTarget=animals[Math.floor(Math.random()*animals.length)];listenDone=false;$('listenFeedback').textContent='';$('listenSpeech').textContent='小朋友，听一听！是谁在叫呀？';renderCards($('listenAnimals'),(a,b)=>{if(listenDone)return;if(a.id===listenTarget.id){listenDone=true;listenPoints++;b.classList.add('correct');$('listenFeedback').textContent='🎉 太棒啦！这是'+a.name+'！';$('listenSpeech').textContent='小朋友真棒！你帮我找到了'+a.name+'！';$('listenScore').textContent='答对 '+listenPoints+' 题';speak('太棒啦！这是'+a.name)}else{b.classList.add('wrong');$('listenFeedback').textContent='再听一次，想一想！';speak('再试一次')}})}
function playCall(){let audio=new Audio(audioBase+listenTarget.id+'.mp3');audio.play().catch(()=>speak(listenTarget.call))}function chooseFind(initial=false){findTarget=animals[Math.floor(Math.random()*animals.length)];findDone=false;$('findFeedback').textContent='';$('findPrompt').textContent='请找到：'+findTarget.name;renderCards($('findAnimals'),(a,b)=>{if(findDone)return;if(a.id===findTarget.id){findDone=true;findPoints++;b.classList.add('correct');$('findFeedback').textContent='⭐ 找到了！这是'+a.name+'！';$('findScore').textContent='答对 '+findPoints+' 题';speak('真棒！这是'+a.name)}else{b.classList.add('wrong');$('findFeedback').textContent='还不是它，再找一找！';speak('再找一找')}});if(!initial)speak('请找到'+findTarget.name)}
function showLike(initial=false){let a=animals[likeIndex%animals.length];$('likeImg').src=imageBase+a.id+'.png';$('likeImg').alt=a.name;$('likePrompt').textContent='你喜欢'+a.name+'吗？';$('likeFeedback').textContent='';if(!initial)speak('你喜欢'+a.name+'吗？')}function answerLike(yes){let a=animals[likeIndex%animals.length];let t='我'+(yes?'':'不')+'喜欢'+a.name;$('likeFeedback').textContent='👏 '+t+'。';speak(t)}
$('listenQuestionAudio').onclick=()=>speak('小朋友，听一听！是谁在叫呀？');$('findQuestionAudio').onclick=()=>speak('请找到'+findTarget.name);$('likeQuestionAudio').onclick=()=>speak('你喜欢'+animals[likeIndex%animals.length].name+'吗？');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['listen','find','like','learn'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.page))});$('play').onclick=playCall;$('repeat').onclick=playCall;$('listenNext').onclick=chooseListen;$('findNext').onclick=chooseFind;$('yes').onclick=()=>answerLike(true);$('no').onclick=()=>answerLike(false);$('likeNext').onclick=()=>{likeIndex++;showLike()};function renderVideoAnimals(){const box=$('videoAnimals');animals.forEach(a=>{const card=document.createElement('article');card.className='video-card';const video=document.createElement('video');video.src='assets/video/'+a.id+'.mp4';video.poster=imageBase+a.id+'.png';video.preload='metadata';video.controls=true;video.playsInline=true;video.setAttribute('aria-label',a.name+'的视频');video.addEventListener('play',()=>{box.querySelectorAll('video').forEach(other=>{if(other!==video)other.pause()})});const name=document.createElement('h3');name.textContent=a.name;const read=document.createElement('button');read.className='read-line';read.textContent=a.name+'，这是'+a.name+'。 🔊';read.setAttribute('aria-label','朗读：'+a.name+'，这是'+a.name);read.onclick=()=>speak(a.name+'，这是'+a.name+'。');card.append(video,name,read);box.appendChild(card)})}renderVideoAnimals();chooseListen();chooseFind(true);showLike(true);

// ===== 朗读：优先播放预生成的 Edge TTS 音频，找不到则回退浏览器语音 =====
function fallbackSpeak(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=0.83;
  window.speechSynthesis.speak(u);
}
function farmSpeak(text){
  if(!text)return;
  const map=window.TTS_AUDIO||{};
  const src=map[text];
  if(src){
    if(window.__ttsAudio){window.__ttsAudio.pause();window.__ttsAudio=null}
    const a=new Audio(src);
    window.__ttsAudio=a;
    a.play().catch(()=>fallbackSpeak(text));
  }else{
    console.warn('[TTS] 没有预生成音频，回退浏览器语音：', JSON.stringify(text));
    fallbackSpeak(text);
  }
}
</script>
