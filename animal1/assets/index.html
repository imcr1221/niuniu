<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会动的农场动物</title><style>body{font-family:system-ui,sans-serif;background:#fff9ed;color:#5e412f;margin:0;padding:24px}h1{text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;max-width:1050px;margin:auto}.card{background:white;border-radius:22px;padding:12px;box-shadow:0 4px 18px #bda27a25;text-align:center}.card img{width:100%;border-radius:14px;cursor:pointer}.card button{font-size:22px;background:#ffdf85;border:0;border-radius:18px;padding:12px 20px;cursor:pointer;margin:8px}.card p{font-size:21px;font-weight:650}</style></head><body><h1>🐾 会动的农场动物</h1><div class="grid" id="cards"></div><script>const animals=[['dog','小狗','汪汪汪'],['cat','小猫','喵喵喵'],['chick','小鸡','叽叽叽'],['duck','小鸭','嘎嘎嘎'],['mouse','小老鼠','吱吱吱']];let current=null;const cards=document.querySelector('#cards');function play(id){if(current){current.pause();current.currentTime=0}current=new Audio('audio/'+id+'.mp3');current.play().catch(()=>{});}for(const [id,name,sound] of animals){let el=document.createElement('div');el.className='card';el.innerHTML=`<img src="images/${id}.gif" alt="${name}正在活动"><p>${name}，这是${name}。</p><button type="button">🔊 听${name}叫</button>`;el.querySelector('img').onclick=()=>play(id);el.querySelector('button').onclick=()=>play(id);cards.appendChild(el)}</script></body></html>
