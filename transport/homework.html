<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>交通工具｜三天中文小游戏</title>
<style>
:root{--ink:#304d57;--muted:#69818a;--teal:#268a83;--light:#ecf9f5;--gold:#ffefc9;--border:#deecea}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Microsoft YaHei','PingFang SC',sans-serif;color:var(--ink);background:linear-gradient(135deg,#e9f8f3,#fffaf0 55%,#eef3ff);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #f6b65e;outline-offset:3px}.wrap{max-width:1040px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.back{background:#fff;border:1px solid var(--border);border-radius:999px;padding:10px 16px;text-decoration:none;color:var(--ink);font-weight:700}h1{font-size:clamp(27px,4vw,39px);margin:20px 0 5px}h2{font-size:clamp(23px,3vw,30px);margin:4px 0 8px}.lead{color:var(--muted);margin:0 0 18px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.tab{padding:15px 8px;border-radius:19px;background:#fff;border:2px solid var(--border);font-weight:800;color:var(--ink)}.tab.active{background:#dcf4e9;border-color:#71bfa8}.panel{background:#ffffffee;border:2px solid white;border-radius:27px;box-shadow:0 12px 34px #376c6d15;padding:clamp(15px,3vw,30px);min-height:420px}.eyebrow{color:var(--teal);font-size:14px;font-weight:800}.hint{color:var(--muted);font-size:16px;line-height:1.6}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:18px 0}.btn{background:#fff;border:2px solid var(--border);border-radius:999px;padding:10px 18px;font-weight:800;color:var(--ink)}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn:disabled{opacity:.45;cursor:default}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.tile{background:#fff;border:2px solid var(--border);border-radius:19px;padding:12px 8px;min-height:148px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink);font-weight:800;font-size:19px}.tile:hover:not(:disabled){border-color:#71bfa8}.tile img{width:100%;height:100px;object-fit:contain}.tile .emoji{font-size:70px;line-height:1.3}.tile.correct{border-color:#48b89a;background:#e7f9ef}.tile.wrong{border-color:#e5b48c;background:#fff4e9}.feedback{text-align:center;min-height:44px;font-size:22px;font-weight:800;color:#28856b;padding:8px}.progress{text-align:center;color:var(--muted);font-size:14px;font-weight:700}.pair{display:grid;grid-template-columns:minmax(0,1fr) 65px minmax(0,1fr);gap:10px;align-items:center;margin:20px auto;max-width:720px}.picture{background:#f1faf8;border:2px solid #dcece9;border-radius:22px;min-height:190px;padding:15px;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:21px;font-weight:800}.picture img{max-width:100%;width:260px;height:145px;object-fit:contain}.picture .big{font-size:94px;line-height:1.2}.arrow{text-align:center;font-size:45px;color:#62a8a2}.sentence{text-align:center;font-size:clamp(23px,3.6vw,34px);font-weight:900;margin:20px 0}.choices{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:14px 0}.choice{border:2px solid var(--border);background:white;border-radius:17px;padding:10px 14px;font-weight:800}.choice.selected{background:#e1f5ec;border-color:#56b699}.scenario{background:#f1f9f6;border-radius:20px;padding:22px;text-align:center;font-size:clamp(22px,3vw,30px);font-weight:800;margin:18px 0}.small{font-size:14px;color:var(--muted)}.end{margin-top:20px;text-align:center;background:#fff5d9;padding:16px;border-radius:20px}.audio-status{min-height:20px;text-align:center;color:#966a40;font-size:14px}.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:22px}@media(max-width:560px){.grid{gap:7px}.tile{min-height:116px;padding:7px 3px;font-size:15px}.tile img{height:70px}.tile .emoji{font-size:44px}.pair{grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:5px}.picture{min-height:155px;padding:7px;font-size:17px}.picture img{height:100px}.picture .big{font-size:65px}.arrow{font-size:24px}.tab{font-size:14px;padding:13px 4px}}
</style>
</head>
<body><div class="wrap"><div class="top"><div>🌈 中文启蒙 · 课后小游戏</div><a class="back" href="index.html">← 返回交通工具课堂</a></div><h1>🚗 交通工具大闯关</h1><p class="lead">三天小游戏 · 听一听、找一找、说一说 · 不用写字</p><div class="tabs" id="tabs"></div><div class="audio-status" id="audioStatus" role="status" aria-live="polite"></div><main class="panel" id="app"></main><div class="foot">和爸爸妈妈一起玩，慢慢说，开心最重要 🌼</div></div>
<script type="application/json" id="tts-texts">["答对啦！你真棒！", "再试一次！", "汽车在哪里？", "自行车在哪里？", "公交车在哪里？", "火车在哪里？", "飞机在哪里？", "船在哪里？", "出租车在哪里？", "马车在哪里？", "我坐汽车去超市。", "我坐公交车去上学。", "我骑自行车去公园。", "我坐飞机去中国。", "我坐出租车去机场。", "我坐马车去公园。", "小朋友迷路了！谁来帮忙？", "老爷爷摔倒了！谁来帮忙？", "房子着火了！谁来帮忙？", "警察！警察开着警车来帮忙了！", "救护车！医生坐救护车来帮忙了！", "消防员！消防员开着消防车来救火了！"]</script>
<script src="assets/audio/tts-manifest.js"></script>
<script>
'use strict';
const vehicles=[['car','汽车','🚗'],['bike','自行车','🚲'],['bus','公交车','🚌'],['train','火车','🚆'],['plane','飞机','✈️'],['boat','船','⛵'],['taxi','出租车','🚕'],['carriage','马车','🐴']];
const destinations=[{id:'car',place:'超市',icon:'🏪',sentence:'我坐汽车去超市。'},{id:'bus',place:'学校',icon:'🏫',sentence:'我坐公交车去上学。'},{id:'bike',place:'公园',icon:'🌳',sentence:'我骑自行车去公园。'},{id:'plane',place:'中国',icon:'🇨🇳',sentence:'我坐飞机去中国。'},{id:'taxi',place:'机场',icon:'🛫',sentence:'我坐出租车去机场。'},{id:'carriage',place:'公园',icon:'🌳',sentence:'我坐马车去公园。'}];
const emergencies=[{icon:'🧒',prompt:'小朋友迷路了！谁来帮忙？',id:'police',name:'警车',answer:'警察！警察开着警车来帮忙了！'},{icon:'👴',prompt:'老爷爷摔倒了！谁来帮忙？',id:'ambulance',name:'救护车',answer:'救护车！医生坐救护车来帮忙了！'},{icon:'🏠🔥',prompt:'房子着火了！谁来帮忙？',id:'fire',name:'消防车',answer:'消防员！消防员开着消防车来救火了！'}];
const emergencyOptions=[['police','警车','🚓'],['ambulance','救护车','🚑'],['fire','消防车','🚒']];
const app=document.getElementById('app'),tabs=document.getElementById('tabs');let day=0,q=0,answered=false,points=[0,0,0],listenQuestions=[],speechMap={};let currentAudio=null;const audioStatus=document.getElementById('audioStatus');
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function img(id,emoji){return `<img src="assets/images/${id}.jpg" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="emoji" style="display:none">${emoji}</span>`}
function escapeHTML(t){return String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
// Homework is transport/homework.html. Reuse pictures and TTS from transport/assets/.
// 与课堂共用自动生成的 TTS 清单；不调用浏览器内置朗读。
speechMap=window.TTS_AUDIO||{};
function speak(text){
  if(currentAudio){currentAudio.pause();currentAudio=null}
  audioStatus.textContent='';
  const ref=speechMap[text];
  if(!ref){audioStatus.textContent='这句语音尚未登记：'+text+'。请重新运行 TTS 工作流。';return}
  const name=ref.split('/').pop();
  const candidates=['assets/audio/'+name,'assets/audio/speech/'+name];
  let i=0;
  function attempt(){
    if(i>=candidates.length){audioStatus.textContent='找不到 MP3：'+name;return}
    const a=new Audio(candidates[i++]);currentAudio=a;
    a.onerror=attempt;
    a.play().catch(attempt);
  }
  attempt();
}
function initQuestions(){listenQuestions=shuffle(vehicles).slice(0,6).map((v,i)=>({target:v,options:shuffle([v,...shuffle(vehicles.filter(x=>x[0]!==v[0])).slice(0,2)])}));}
function changeDay(d){day=d;q=0;answered=false;if(day===0)initQuestions();render()}
function render(){tabs.innerHTML=['第一天 · 认一认','第二天 · 去哪里','第三天 · 谁帮忙'].map((t,i)=>`<button class="tab ${day===i?'active':''}" data-day="${i}">${t}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>changeDay(+b.dataset.day));if(day===0)renderDay1();else if(day===1)renderDay2();else renderDay3()}
function feedback(correct,answer){const el=app.querySelector('#feedback');el.textContent=correct?'⭐ 答对啦！你真棒！':'再试一次！';if(correct){answered=true;points[day]++;speak('答对啦！你真棒！')}else speak('再试一次！');if(correct&&answer){const label=app.querySelector('#answer');if(label)label.textContent=answer}app.querySelectorAll('[data-answer]').forEach(b=>{if(correct)b.disabled=true})}
function footerButtons(max){return `<div class="actions"><button class="btn" id="prev" ${q===0?'disabled':''}>← 上一题</button><button class="btn primary" id="next">${q===max-1?'再玩一遍 ↻':'下一题 →'}</button></div>`}
function bindPaging(max){app.querySelector('#prev').onclick=()=>{q=Math.max(0,q-1);answered=false;render()};app.querySelector('#next').onclick=()=>{q++;if(q>=max){q=0;if(day===0)initQuestions()}answered=false;render()}}
function renderDay1(){if(!listenQuestions.length)initQuestions();const item=listenQuestions[q],target=item.target;app.innerHTML=`<div class="eyebrow">🌟 第一天：交通工具在哪里？</div><h2>听一听，找一找</h2><p class="hint">点击“听题目”，然后选出正确的交通工具。</p><div class="progress">第 ${q+1} / ${listenQuestions.length} 题</div><div class="actions"><button class="btn primary" id="hear" data-tts-text="${target[1]}在哪里？">🔊 听题目</button></div><div class="grid">${item.options.map(v=>`<button class="tile" data-answer="${v[0]}">${img(v[0],v[2])}<span>${v[1]}</span></button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="progress" id="answer"></div>${footerButtons(listenQuestions.length)}<div class="small">小挑战：选对以后，自己说“这是${target[1]}。”</div>`;app.querySelector('#hear').onclick=()=>speak(target[1]+'在哪里？');app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(!answered)feedback(b.dataset.answer===target[0],'这是'+target[1]+'。')});bindPaging(listenQuestions.length)}
function renderDay2(){const item=destinations[q],v=vehicles.find(v=>v[0]===item.id);app.innerHTML=`<div class="eyebrow">🌟 第二天：我们去哪里？</div><h2>看图片，说一说</h2><p class="hint">左边是交通工具，右边是目的地。先自己说，再点击“听一句”核对。</p><div class="progress">第 ${q+1} / ${destinations.length} 题</div><div class="pair"><div class="picture">${img(v[0],v[2])}<span>${v[1]}</span></div><div class="arrow">➜</div><div class="picture"><span class="big">${item.icon}</span><span>${item.place}</span></div></div><div class="sentence" id="sentence">我……去……</div><div class="actions"><button class="btn primary" id="reveal">✨ 看答案</button><button class="btn" id="hear" data-tts-text="${item.sentence}">🔊 听一句</button></div><div class="feedback" id="feedback"></div>${footerButtons(destinations.length)}<p class="small">记得：坐汽车、坐公交车、坐飞机；但是要说“骑自行车”。</p>`;app.querySelector('#reveal').onclick=()=>{app.querySelector('#sentence').textContent=item.sentence;app.querySelector('#feedback').textContent='🌟 说得真棒！'};app.querySelector('#hear').onclick=()=>{app.querySelector('#sentence').textContent=item.sentence;speak(item.sentence)};bindPaging(destinations.length)}
function renderDay3(){const item=emergencies[q];app.innerHTML=`<div class="eyebrow">🌟 第三天：谁来帮忙？</div><h2>听情景，选一选</h2><p class="hint">家长可以先读题目，也可以点击“听情景”。</p><div class="progress">第 ${q+1} / ${emergencies.length} 题</div><div class="scenario">${item.icon}<div>${item.prompt}</div></div><div class="actions"><button class="btn primary" id="hear" data-tts-text="${item.prompt}">🔊 听情景</button></div><div class="grid">${emergencyOptions.map(v=>`<button class="tile" data-answer="${v[0]}">${img(v[0],v[2])}<span>${v[1]}</span></button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="sentence" id="answer"></div><div class="actions"><button class="btn" id="full" data-tts-text="${item.answer}">🔊 听完整句子</button></div>${footerButtons(emergencies.length)}`;app.querySelector('#hear').onclick=()=>speak(item.prompt);app.querySelector('#full').onclick=()=>{app.querySelector('#answer').textContent=item.answer;speak(item.answer)};app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(!answered){const correct=b.dataset.answer===item.id;feedback(correct,correct?item.answer:'')}});bindPaging(emergencies.length)}
initQuestions();render();
</script></body></html>
