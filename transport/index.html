<script>

const manifest= window.TTS_AUDIO || {};
const nav=document.getElementById('nav'),app=document.getElementById('app'),status=document.getElementById('audioStatus');
const tabs=[['learn','认识交通工具'],['listen','听一听，找一找'],['missing','谁不见了'],['uses','有什么用'],['speak','我会说']];
let tab='learn',idx=0,lastText='',audio=null,listenTarget=null,listenChoices=[],score=0,answered=false,missingGroup=null,missingGoneIndex=0,missingHidden=false,missingAnswer=false,speakLevel=0,speakId='bus',advancedIndex=0;
const find=id=>vehicles.find(x=>x.id===id),shuffle=a=>[...a].sort(()=>Math.random()-.5),safe=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function play(text){
  lastText=text;
  if(audio){audio.pause();audio=null}
  const path=manifest[text];
  if(!path){status.textContent='尚未生成或登记这句语音：'+text+'。请重新运行 TTS 工作流，并确认 tts-manifest.js 已更新。';return}
  const filename=path.split('/').pop();
  const paths=[
    'assets/audio/'+filename,
    'audio/'+filename,
    'audio/speech/'+filename,
    'assets/audio/speech/'+filename
  ];
  let index=0;
  status.textContent='';
  function tryNext(){
    if(index>=paths.length){
      status.textContent='找不到对应的MP3文件：'+filename+'。请确认文件名与大小写一致。';
      return;
    }
    const current=new Audio(paths[index++]);
    audio=current;
    current.onerror=tryNext;
    current.play().catch(tryNext);
  }
  tryNext();
}
document.getElementById('repeat').onclick=()=>{if(lastText)play(lastText)};
function button(text,phrase,extra=''){return `<button class="btn ${extra}" data-tts-text="${safe(phrase)}" data-play="${safe(phrase)}">${text}</button>`}
function card(v,show=true){return `<button class="vehicle" data-id="${v.id}" aria-label="${v.name}"><img class="vehicle-img" src="assets/images/${v.id}.jpg" alt="" loading="lazy">${show?`<span class="name">${v.name}</span>`:''}</button>`}

function renderNav(){nav.innerHTML=tabs.map(([id,label])=>`<button data-tab="${id}" class="${id===tab?'active':''}">${label}</button>`).join('')+`<a class="homework-link" href="homework.html">📝 课后作业 →</a>`;nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function renderLearn(){let v=vehicles[idx];app.innerHTML=`<div class="counter">认识交通工具 · ${idx+1} / ${vehicles.length}</div><h2>${v.name}</h2><div class="hero" id="hero" role="img" aria-label="${v.name}"><img class="hero-img" src="assets/images/${v.id}.jpg" alt="${v.name}"></div><p class="sentence">${v.name}</p><div class="controls"><button class="btn" id="prev" ${idx===0?'disabled':''}>← 上一个</button>${button('🔊 听名称',v.name+'。','primary')}${button('🔊 听一句',v.simple)}<button class="btn" id="next" ${idx===vehicles.length-1?'disabled':''}>下一个 →</button></div>`;app.querySelector('#prev').onclick=()=>{idx--;render()};app.querySelector('#next').onclick=()=>{idx++;render()};app.querySelector('#hero').onclick=()=>play(v.name+'。');bindPlay()}
function newListen(){listenTarget=vehicles[Math.floor(Math.random()*vehicles.length)];listenChoices=shuffle([listenTarget,...shuffle(vehicles.filter(v=>v.id!==listenTarget.id)).slice(0,5)]);answered=false;render()}
function renderListen(){if(!listenTarget){newListen();return}let q=listenTarget.name+'在哪里？';app.innerHTML=`<div class="counter">听一听，找一找 · 答对 ${score} 题</div><h2>听一听！找一找！</h2><div class="controls">${button('🔊 听题目',q,'primary')}<button class="btn" id="next">换一题 ↻</button></div><div class="choice">${listenChoices.map(v=>card(v,false)).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div>`;app.querySelector('#next').onclick=newListen;app.querySelectorAll('.vehicle').forEach(b=>b.onclick=()=>{if(answered)return;let correct=b.dataset.id===listenTarget.id;app.querySelector('#feedback').textContent=correct?'⭐ 答对啦！你真棒！':'再试一次！';play(correct?'答对啦！你真棒！':'再试一次！');if(correct){answered=true;score++;b.style.borderColor='#54b6a1';b.insertAdjacentHTML('beforeend',`<span class="name">${listenTarget.name}</span>`)}});bindPlay()}
function newMissing(){missingGroup=shuffle(vehicles).slice(0,3);missingGoneIndex=Math.floor(Math.random()*3);missingHidden=false;missingAnswer=false;render()}
function renderMissing(){if(!missingGroup){newMissing();return}const gone=missingGroup[missingGoneIndex],answerLine='原来是'+gone.name+'不见了！';app.innerHTML=`<h2>谁不见了？</h2><p class="hint">先记住这三种交通工具。</p><div class="memory">${missingGroup.map((v,i)=>`<div class="tile ${missingHidden&&i===missingGoneIndex?'blank':''}" aria-label="${missingHidden&&i===missingGoneIndex?'空位':v.name}">${missingHidden&&i===missingGoneIndex?'❓':`<img class="tile-img" src="assets/images/${v.id}.jpg" alt="${v.name}">`}</div>`).join('')}</div><div class="controls"><button class="btn primary" id="hide">${missingHidden?'再看一遍':'藏起来！'}</button>${missingHidden?button('🔊 谁不见了？','谁不见了？'):''}<button class="btn" id="fresh">换一组</button></div>${missingHidden?`<div class="controls"><button class="btn" id="answer">看答案</button></div>`:''}<div class="feedback" aria-live="polite">${missingAnswer?answerLine:''}</div>`;app.querySelector('#hide').onclick=()=>{missingHidden=!missingHidden;missingAnswer=false;render()};app.querySelector('#fresh').onclick=newMissing;if(missingHidden)app.querySelector('#answer').onclick=()=>{missingAnswer=true;app.querySelector('.feedback').textContent=answerLine;play(answerLine)};bindPlay()}
function renderUses(){const emergency=uses.filter(u=>['police','oldman','fire'].includes(u.id));app.innerHTML=`<h2>这些特殊车辆有什么用？</h2><p class="hint">看一看发生了什么事，想一想谁来帮忙。</p><div class="uses">${emergency.map(u=>{let img={police:'police-help.jpg',oldman:'oldman-help.jpg',fire:'fire-help.jpg'}[u.id];return `<div class="use"><img src="assets/images/${img}" alt="${u.title}"><h3>${u.title}</h3><p>${u.lines.join('　')}</p>${u.lines.map(line=>button('🔊 '+line,line,'primary')).join('')}</div>`}).join('')}</div>`;bindPlay()}
const destinations=[{name:'学校',emoji:'🏫'},{name:'超市',emoji:'🏪'},{name:'机场',emoji:'🛫'},{name:'公园',emoji:'🌳'},{name:'中国',emoji:'🏯'},{name:'小岛',emoji:'🏝️'},{name:'游乐园',emoji:'🎡'}];
function getDestination(a){if(a.text.includes('超市'))return destinations[1];if(a.text.includes('上学'))return destinations[0];if(a.text.includes('机场'))return destinations[2];if(a.text.includes('公园'))return destinations[3];if(a.text.includes('中国'))return destinations[4];if(a.text.includes('小岛'))return destinations[5];return destinations[6]}
function renderSpeak(){let ordinary=vehicles.filter(v=>v.kind!=='特殊'),current=find(speakId),task=advanced[advancedIndex],line=speakLevel===0?current.simple:task.text,place=getDestination(task);app.innerHTML=`<h2>看图片，说一说！</h2><div class="controls"><button class="btn ${speakLevel===0?'primary':''}" id="easy">第一关：我坐……</button><button class="btn ${speakLevel===1?'primary':''}" id="hard">第二关：去哪里？</button></div>${speakLevel===0?`<p class="hint">你想坐什么？选一选。</p><div class="chips">${ordinary.map(v=>`<button class="chip ${v.id===speakId?'active':''}" data-vehicle="${v.id}"><img src="assets/images/${v.id}.jpg" alt=""> ${v.name}</button>`).join('')}</div><div class="hero" style="min-height:175px"><img class="hero-img" style="max-height:200px" src="assets/images/${speakId}.jpg" alt="${current.name}"></div>`:`<p class="hint">左边是什么交通工具？右边要去哪里？连起来说一句话。</p><div class="practice-nav"><button class="btn" id="previousTask" ${advancedIndex===0?'disabled':''}>← 上一句</button><span class="counter">${advancedIndex+1} / ${advanced.length}</span><button class="btn" id="nextTask" ${advancedIndex===advanced.length-1?'disabled':''}>下一句 →</button></div><div class="destination-pair"><div class="picture-card"><img src="assets/images/${task.id}.jpg" alt="${find(task.id).name}"><strong>${find(task.id).name}</strong></div><div class="arrow" aria-hidden="true">➜</div><div class="picture-card"><div class="place-emoji" aria-hidden="true">${place.emoji}</div><strong>${place.name}</strong></div></div>`}<div class="sentence">${line}</div><div class="controls">${button('🔊 听一句',line,'primary')}</div>`;app.querySelector('#easy').onclick=()=>{speakLevel=0;render()};app.querySelector('#hard').onclick=()=>{speakLevel=1;render()};app.querySelectorAll('[data-vehicle]').forEach(b=>b.onclick=()=>{speakId=b.dataset.vehicle;render()});if(speakLevel===1){app.querySelector('#previousTask').onclick=()=>{advancedIndex--;render()};app.querySelector('#nextTask').onclick=()=>{advancedIndex++;render()}}bindPlay()}
function render(){renderNav();if(tab==='learn')renderLearn();else if(tab==='listen')renderListen();else if(tab==='missing')renderMissing();else if(tab==='uses')renderUses();else renderSpeak()}
render();
</script></body></html>
