function renderListen(){if(!listenTarget){newListen();return}let q=listenTarget.name+'在哪里？';app.innerHTML=`<div class="counter">听一听，找一找 · 答对 ${score} 题</div><h2>听一听！找一找！</h2><div class="controls">${button('🔊 听题目',q,'primary')}<button class="btn" id="next">换一题 ↻</button></div><div class="choice">${listenChoices.map(v=>card(v,false)).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div>`;app.querySelector('#next').onclick=newListen;app.querySelectorAll('.vehicle').forEach(b=>b.onclick=()=>{if(answered)return;let correct=b.dataset.id===listenTarget.id;app.querySelector('#feedback').textContent=correct?'⭐ 对啦！':'再试一次！';play(correct?'对啦！':'再试一次！');if(correct){answered=true;score++;b.style.borderColor='#54b6a1';b.insertAdjacentHTML('beforeend',`<span class="name">${listenTarget.name}</span>`)}});bindPlay()}
function newMissing(){missingGroup=shuffle(vehicles).slice(0,3);missingHidden=false;missingAnswer=false;render()}
function renderMissing(){if(!missingGroup){newMissing();return}const gone=missingGroup[1];app.innerHTML=`<h2>谁不见了？</h2><p class="hint">先记住这三种交通工具。</p><div class="memory">${missingGroup.map((v,i)=>`<div class="tile ${missingHidden&&i===1?'blank':''}" aria-label="${missingHidden&&i===1?'空位':v.name}">${missingHidden&&i===1?'❓':`<img class="tile-img" src="assets/images/${v.id}.jpg" alt="${v.name}">`}</div>`).join('')}</div><div class="controls"><button class="btn primary" id="hide">${missingHidden?'再看一遍':'藏起来！'}</button>${missingHidden?button('🔊 谁不见了？','谁不见了？'):''}<button class="btn" id="fresh">换一组</button></div>${missingHidden?`<div class="controls"><button class="btn" id="answer">看答案</button></div>`:''}<div class="feedback">${missingAnswer?'不见的是：'+gone.name+'！':''}</div>`;app.querySelector('#hide').onclick=()=>{missingHidden=!missingHidden;missingAnswer=false;render()};app.querySelector('#fresh').onclick=newMissing;if(missingHidden)app.querySelector('#answer').onclick=()=>{missingAnswer=true;app.querySelector('.feedback').textContent='不见的是：'+gone.name+'！';play(gone.name+'。')};bindPlay()}
function renderUses(){app.innerHTML=`<h2>这些车有什么用？</h2><div class="uses">${uses.map(u=>{let img={school:'school.jpg',travel:'travel.jpg',park:'park.jpg',plane:'plane.jpg',boat:'boat.jpg',police:'police-help.jpg',oldman:'oldman-help.jpg',fire:'fire-help.jpg'}[u.id];return `<div class="use">${img?`<img src="assets/images/${img}" alt="${u.title}">`:`<div class="useicon" aria-hidden="true">${u.emoji}</div>`}<h3>${u.title}</h3><p>${u.lines ? u.lines.join('　') : u.speech}</p>${u.lines ? u.lines.map(line=>button('🔊 '+line,line,'primary')).join('') : button('🔊 听一听',u.speech,'primary')}</div>`}).join('')}</div><div class="teacher">看图片，听一听，再说一说：谁来帮忙？</div><div class="controls"></div>`;bindPlay()}
function renderSpeak(){let ordinary=vehicles.filter(v=>v.kind!=='特殊'),current=find(speakId),line=speakLevel===0?current.simple:advanced[advancedIndex].text;app.innerHTML=`<h2>看图片，说一说！</h2><div class="controls"><button class="btn ${speakLevel===0?'primary':''}" id="easy">第一关：我坐……</button><button class="btn ${speakLevel===1?'primary':''}" id="hard">第二关：去哪里？</button></div>${speakLevel===0?`<p class="hint">你想坐什么？选一选。</p><div class="chips">${ordinary.map(v=>`<button class="chip ${v.id===speakId?'active':''}" data-vehicle="${v.id}"><img src="assets/images/${v.id}.jpg" alt=""> ${v.name}</button>`).join('')}</div>`:`<p class="hint">先看图，再自己说一说。</p><div class="chips">${advanced.map((a,i)=>`<button class="chip ${i===advancedIndex?'active':''}" data-advanced="${i}"><img src="assets/images/${a.id}.jpg" alt=""> ${i+1}</button>`).join('')}</div>`}<div class="hero" style="min-height:175px"><img class="hero-img" style="max-height:200px" src="assets/images/${speakLevel===0?speakId:advanced[advancedIndex].id}.jpg" alt=""></div><div class="sentence">${line}</div><div class="controls">${button('🔊 听一句',line,'primary')}</div><div class="teacher">第一关练短句；第二关只使用预先设计好的自然句子，不会把车辆和地点随机拼成奇怪的句子。</div>`;app.querySelector('#easy').onclick=()=>{speakLevel=0;render()};app.querySelector('#hard').onclick=()=>{speakLevel=1;render()};app.querySelectorAll('[data-vehicle]').forEach(b=>b.onclick=()=>{speakId=b.dataset.vehicle;render()});app.querySelectorAll('[data-advanced]').forEach(b=>b.onclick=()=>{advancedIndex=Number(b.dataset.advanced);render()});bindPlay()}
function render(){renderNav();if(tab==='learn')renderLearn();else if(tab==='listen')renderListen();else if(tab==='missing')renderMissing();else if(tab==='uses')renderUses();else renderSpeak()}
render();
</script></body></html>
