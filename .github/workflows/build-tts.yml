name: Build TTS Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  animal1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animal1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts
      - run: python generate_audio.py
      - name: Commit audio
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add animal1/audio/
          git diff --staged --quiet || git commit -m "chore: update TTS audio for animal1"
          git pull --rebase origin main || true
          git push

  animal2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animal2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts
      - run: python generate_audio.py
      - name: Commit audio
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add animal2/audio/
          git diff --staged --quiet || git commit -m "chore: update TTS audio for animal2"
          git pull --rebase origin main || true
          git push
