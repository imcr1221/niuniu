name: Build TTS Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  animal1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animal1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts
      - run: python generate_audio.py
      - name: Generate tts-tests.json
        run: |
          python3 - <<'EOF'
          import json, re
          from pathlib import Path

          raw = Path("audio/tts-manifest.js").read_text(encoding="utf-8")
          m = re.search(r"=\s*(\{.*\})\s*;?\s*$", raw, re.S)
          data = json.loads(m.group(1))

          sub = Path.cwd().name
          tests = [
              {"id": f"{sub}-{i+1}", "text": t, "audio": a}
              for i, (t, a) in enumerate(data.items())
          ]
          Path("tts-tests.json").write_text(
              json.dumps(tests, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"{sub}: {len(tests)} 条")
          EOF
      - name: Commit audio
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add animal1/audio/ animal1/tts-tests.json
          git diff --staged --quiet || git commit -m "chore: update TTS audio for animal1"
          git pull --rebase origin main || true
          git push

  animal2:
