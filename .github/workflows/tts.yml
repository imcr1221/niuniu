name: Generate TTS Audio

on:
  workflow_dispatch:
  push:
    paths:
      - 'animal1/tts-texts.json'
      - 'animal1/generate_audio.py'
      - 'animal2/tts-texts.json'
      - 'animal2/generate_audio.py'
      - '.github/workflows/tts.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dir:
          - animal1
          - animal2
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Generate audio
        run: python generate_audio.py

      - name: Commit audio
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.dir }}/audio/"
          git diff --staged --quiet || git commit -m "chore: update TTS audio for ${{ matrix.dir }}"
          git push
