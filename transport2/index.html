$('#scenePrev').onclick=()=>{si=Math.max(0,si-1);renderScene()};$('#sceneNext').onclick=()=>{si=(si+1)%scenes.length;renderScene()};
$('#observations').innerHTML=observations.map(([q,img])=>`<article class="practice"><img src="images/${img}" alt="${q}"><p style="font-weight:700;margin:8px 0">${q}</p><button class="btn soft small" data-ob="${q}">🔊 听问题</button></article>`).join('');
$$('[data-ob]').forEach(b=>b.onclick=()=>say(b.dataset.ob));
let day=1;const dayNames=['认一认，说一说','谁来帮忙？','生活中的交通工具'];
function renderDay(){$('#dayProgress').textContent=`已完成 ${state.days.length} / 3 天`;$('#dayNav').innerHTML=[1,2,3].map(n=>`<button class="day ${day===n?'active':''}" data-day="${n}"><span class="daynum">第${['一','二','三'][n-1]}天</span><strong>${dayNames[n-1]}</strong><small>${state.days.includes(n)?'完成啦 ✓':'5—8分钟 · 口语小游戏'}</small></button>`).join('');$$('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;renderDay()});let c='';
if(day===1)c=`<p>① 点击交通工具图片，听名称，再自己说一遍。</p><div class="minicards">${vehicles.map(([n,img])=>`<button class="mini" data-home-say="${n}"><img src="images/${img}" alt="${n}"><span>🔊 ${n}</span></button>`).join('')}</div><p style="margin-top:16px">② 试着说两句话：“我划小船。”“垃圾车收垃圾。”</p>`;
if(day===2)c=`<p>① 看情境，想一想谁来帮忙。</p><div class="minicards">${scenes.slice(0,3).map(([q,img,a])=>`<button class="mini" data-home-say="${q}"><img src="images/${img}" alt="${q}"><span>🔊 听问题</span></button>`).join('')}</div><p style="margin-top:16px">② 说出：警车来帮忙！救护车来帮忙！消防车来帮忙！</p>`;
if(day===3)c=`<p>① 出门时找一找：今天看见了什么车？试着用中文告诉家长。</p><img class="scene-img" src="images/p36.jpg" alt="各种各样的交通工具"><p>② 告诉家长：“我喜欢……” 说出最喜欢的交通工具。</p><button class="btn soft small" data-home-say="你最喜欢哪辆车？">🔊 听问题</button>`;
$('#dayContent').innerHTML=`<div class="task-title"><h3>第${['一','二','三'][day-1]}天 · ${dayNames[day-1]}</h3><span class="pill">亲子口语</span></div>${c}<div class="completion"><div><strong>${state.days.includes(day)?'今天完成啦！':'练习完成后打个卡'}</strong><p>可以分几次练习，不需要写字。</p></div><button class="btn" id="completeDay">${state.days.includes(day)?'已完成 ✓':'完成今天的作业'}</button></div>`;$$('[data-home-say]').forEach(b=>b.onclick=()=>say(b.dataset.homeSay));$('#completeDay').onclick=()=>{if(!state.days.includes(day))state.days.push(day);save();renderDay();say('今天的中文练习完成啦！')};}
$('#reset').onclick=()=>{if(confirm('要清除这台设备的学习记录吗？')){state={heard:[],days:[]};save();drawVehicles();renderDay()}};
drawVehicles();renderScene();renderDay();
</script></body></html>
